[package]
name = "loggytracy"
version = "0.1.0"
edition = "2024"
default-run = "loggytracy"
# `benches/corpus/` is a shared module, not a bench. Auto-discovery would have
# to be told that anyway, and every target here is declared below.
autobenches = false

[lib]
name = "loggytracy"
path = "src/lib.rs"

[features]
default = []
# Arena-tagged global allocator plus its `/metrics` families, for measuring
# where resident memory actually goes (`docs/MEMORY_ATTRIBUTION.md`). Off by
# default and absent from a release build: with it off, `memprof::enter` is an
# inlined no-op and the process keeps the system allocator.
memprof = []

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
prost014 = { package = "prost", version = "0.14.4" }
tonic = { version = "0.14.6", features = ["transport"] }
# `RetryInfo` on a throttled gRPC push. The OTLP specification makes
# `RESOURCE_EXHAUSTED` retryable *only* when the response carries one, so
# without this the gRPC transport tells a collector to drop what the HTTP
# transport tells it to hold. tonic's own sibling crate at tonic's own version:
# the alternative was ~20 lines defining `google.rpc.Status`/`Any`/`RetryInfo`
# against the `prost` already here, and its failure mode is silent — a wrong
# `type_url` or details encoding still round-trips through a test that decodes
# with the same definitions, and only a real collector would notice.
tonic-types = "0.14.6"
opentelemetry-proto = { version = "0.32.0", features = ["gen-tonic", "trace", "logs", "with-serde"] }
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
crc32fast = "1"
url = "2"
chrono = "0.4"
arrow = { version = "59.1.0", default-features = false }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "zstd"] }
zstd = "0.13"
roaring = "0.11.4"
# The only outbound HTTP client in the process. Retention policies arrive by
# push, so nothing else here calls out.
object_store = { version = "0.12", features = ["aws"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tikv-jemallocator = "0.7.0"
# `statvfs`, for the one thing this process measures about the machine under it:
# how much room is left on the disk the WAL cannot do without.
libc = "0.2"
# Locks without poisoning. A panic under a read guard — a Parquet decode, an
# arithmetic edge — poisons a std lock, and every later `.read().unwrap()` on it
# panics too, so one bad query takes the whole process down with it while the
# process stays up. What the poison flag warns about is a half-written
# structure, and the guards here that write are the ones this codebase already
# treats as fatal; the guards that read cannot leave anything half-written.
parking_lot = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Virtual time. Elapsed-time decisions — the flush cadence, the force-flush
# backoff, the startup retry budget — are logic, and testing logic by waiting
# out a real clock is how they ended up untested.
tokio = { version = "1", features = ["test-util"] }
# The regression gate. `docs/VISION.md` — "the ruler comes before the work".
# Plotters and rayon are off: these run in CI to detect a regression, not to
# draw a distribution.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] }

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "memtable"
harness = false

[[bench]]
name = "rows"
harness = false

[[bench]]
name = "bloom"
harness = false

[[bench]]
name = "part"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "scan_scaling"
harness = false
