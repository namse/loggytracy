[package]
name = "loggytracy"
version = "0.1.0"
edition = "2024"
default-run = "loggytracy"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
bytes = "1"
prost = "0.13"
prost-types = "0.13"
prost014 = { package = "prost", version = "0.14.4" }
tonic = { version = "0.14.6", features = ["transport"] }
opentelemetry-proto = { version = "0.32.0", features = ["gen-tonic", "trace", "with-serde"] }
snap = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crc32fast = "1"
url = "2"
chrono = "0.4"
arrow = { version = "59.1.0", default-features = false }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "zstd"] }
roaring = "0.11.4"
object_store = { version = "0.12", features = ["aws"] }
# Same TLS stack object_store's `aws` feature already links, so the tenant
# policy poller does not pull in a second one.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
