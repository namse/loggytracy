# Prometheus alerting rules for loggytracy.
#
# This file is the machine-readable form of the "What to alert on" table in
# docs/RUNBOOK.md. The table is the decisions -- which signal, what condition,
# what it means -- and it was written first; this is the same content in the
# form a Prometheus can load. Nothing here is a new judgement about what
# matters, and where the two disagree the runbook is right.
#
# `query::tests::every_alert_signal_in_the_runbook_has_a_rule` fails the build
# if a row is added to that table without a rule here, if a rule names a metric
# this engine does not export, or if a rule's metric is not in the table. That
# tie is the point: a rules file that silently falls behind the runbook is worse
# than none, because the operator believes they are covered.
#
# Thresholds are deliberately trend-based rather than absolute wherever an
# absolute one would be a guess about a deployment this project has not seen.
# Two of them cannot be written without a deployment's own numbers, and say so
# in their annotations rather than shipping a number nobody measured.
#
# `for:` durations assume a scrape interval well under a minute.

groups:
  - name: loggytracy-ingest
    rules:
      - alert: LoggytracyIngestThrottled
        expr: increase(loggytracy_ingest_throttled_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "loggytracy is returning 429 to pushes"
          description: >-
            Flush cannot keep up with ingest, so the memtable or WAL backlog
            limit is refusing writes. Backpressure working, not backpressure
            failing -- but the sender is losing headroom.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyWalBacklogGrowing
        expr: deriv(loggytracy_wal_backlog_bytes[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "loggytracy WAL backlog is trending up"
          description: >-
            The same cause as LoggytracyIngestThrottled and the earlier signal:
            the backlog grows before the refusals start.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyIngestQuotaRejecting
        expr: increase(loggytracy_ingest_quota_rejected_total[15m]) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "A tenant is over its ingest rate"
          description: >-
            Different from LoggytracyIngestThrottled: the server is healthy and
            the tenant is sending more than its plan allows. A plan question,
            not a scaling one.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyStreamLimitRejecting
        expr: increase(loggytracy_stream_limit_rejected_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A tenant is creating streams past its limit"
          description: >-
            Usually a client putting a request id or a timestamp in a label,
            not a plan being outgrown. Check the label names before raising
            anything.
          runbook: docs/RUNBOOK.md#what-to-alert-on

  - name: loggytracy-durability
    rules:
      - alert: LoggytracyFlushStopped
        expr: >-
          increase(loggytracy_flush_errors_total[10m]) > 0
          and increase(loggytracy_flush_success_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "loggytracy flush is failing and not succeeding"
          description: >-
            The most dangerous state this engine has: accepted data is not
            reaching durable storage, and errors alone would not say that --
            it is errors with no success between them.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyRemoteStoreUnreachable
        expr: loggytracy_remote_healthy == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "loggytracy cannot reach the object store"
          description: >-
            Set by three consecutive failures with no success between them, so
            an isolated failed request does not trip it.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyRemoteStoreDegrading
        expr: >-
          loggytracy_remote_consecutive_failures > 0
          and loggytracy_remote_consecutive_failures < 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The object store is failing requests without being declared down"
          description: >-
            The early signal the health flag deliberately hides: it takes three
            consecutive failures to clear loggytracy_remote_healthy, and this
            fires below that.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyWalReplayedEntries
        expr: loggytracy_wal_replayed_entries > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "loggytracy replayed WAL entries after a restart"
          description: >-
            The previous run did not shut down cleanly. This is the upper bound
            on log lines this restart may have duplicated -- delivery is
            at-least-once, so records the WAL still held may already have been
            durable, and the next merge collapses the twins.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyDrainNotReachingDurability
        expr: loggytracy_drain_in_progress == 1 and loggytracy_pending_flush_bytes > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A shutdown drain is not reaching durability"
          description: >-
            pending_flush_bytes must reach 0 while draining. It has not, and the
            orchestrator's termination grace is finite.
          runbook: docs/RUNBOOK.md#what-to-alert-on

  - name: loggytracy-retention-and-tenancy
    rules:
      - alert: LoggytracyRetentionRewriteSkipped
        expr: increase(loggytracy_retention_rewrite_skipped_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A retention rewrite was skipped: tenant deletion is not complete"
          description: >-
            Rows a tenant asked to have deleted are masked at read time but
            still on disk and still in object storage. This is the one alert
            here whose meaning is a commitment to someone outside the system.
            Not a size problem -- the rewrite streams, so it cannot fail for
            want of memory at any part size; reaching this counter means I/O or
            a corrupt input.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyUnknownTenants
        expr: loggytracy_tenant_policy_unknown_tenants > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tenants are accumulating data with no policy pushed for them"
          description: >-
            Unknown from the control plane's perspective: the instance is
            holding their data and has no retention or quota to apply to it.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyDeleteHiddenRowsNotRemoved
        expr: deriv(loggytracy_delete_hidden_rows_total[6h]) > 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Deleted rows are still being hidden rather than removed"
          description: >-
            Rising steadily long after a request means no rewrite has reached
            the parts holding those rows. They are invisible to queries and
            still present on disk.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyDeleteRequestsRejected
        expr: increase(loggytracy_delete_requests_rejected_total[1h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A tenant is at its outstanding delete-request limit"
          description: >-
            Each outstanding request is a predicate every one of that tenant's
            scans evaluates per row, which is why the limit exists.
          runbook: docs/RUNBOOK.md#what-to-alert-on

  - name: loggytracy-read-path
    rules:
      - alert: LoggytracyQueryMemoryExhausted
        expr: increase(loggytracy_query_memory_exhausted_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "loggytracy refused a query it was willing to serve"
          description: >-
            The query memory pool had no room. The read side's
            ingest_throttled_total. The client is correctly told 429 and will
            retry, so nothing looks broken from outside and this counter is the
            only place the event is visible. It does not say which of three
            causes -- too many concurrent queries, one query too greedy, or
            LOGGYTRACY_QUERY_MEMORY_BUDGET too small for this deployment -- so
            start at loggytracy_query_latency_ms and the concurrent-scan
            setting.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyQueryQuotaRejecting
        expr: increase(loggytracy_query_quota_rejected_total[15m]) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "A tenant is over its read quota"
          description: >-
            Scan rate or concurrency. Like the ingest one: a plan question, not
            a scaling one.
          runbook: docs/RUNBOOK.md#what-to-alert-on

  - name: loggytracy-layout
    rules:
      - alert: LoggytracyMergeDebtGrowing
        expr: deriv(loggytracy_merge_debt_parts[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "loggytracy merge cannot keep up"
          description: >-
            Parts are accumulating faster than merge consolidates them, and
            query-planning cost rises with the part count.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracySidecarResidentGrowing
        expr: deriv(loggytracy_part_sidecar_resident_bytes[1h]) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Part sidecars are growing resident without being evicted"
          description: >-
            Resident memory linear in part count. The runbook's condition is
            "rising relative to the RSS budget", and this engine exports no
            budget gauge to divide by -- so this fires on the trend alone. A
            deployment that knows its container limit should replace this with
            a ratio against it.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyTenantsScatteredAcrossParts
        expr: >-
          loggytracy_tenant_policy_known_tenants > 0
          and loggytracy_part_count > 0
          and (loggytracy_part_tenant_segments / loggytracy_part_count)
              > 0.8 * loggytracy_tenant_policy_known_tenants
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Nearly every tenant is in nearly every part"
          description: >-
            part_tenant_segments is the number of (tenant, part) pairs, and each
            pair costs one row group, two blooms and one metadata segment. When
            the average tenant width of a part approaches the tenant count, a
            nearly idle tenant costs as much as a busy one. The 0.8 here is the
            only invented number in this file: the shape is the signal, the
            fraction is where a deployment decides it minds.
          runbook: docs/RUNBOOK.md#what-to-alert-on

      - alert: LoggytracyDataDirRunningOut
        expr: >-
          loggytracy_data_dir_total_bytes > 0
          and loggytracy_data_dir_free_bytes < 4294967296
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The data directory's filesystem is running out of room"
          description: >-
            Fires at twice LOGGYTRACY_MIN_FREE_DISK_BYTES, not at it: at the
            floor ingest is already being refused, and this is the warning
            before that. The 4 GiB literal is twice the *default* floor -- a
            deployment that moved the knob has to move this number with it,
            because Prometheus cannot read the process's configuration. Divide
            by loggytracy_data_dir_total_bytes for a percentage.
          runbook: docs/RUNBOOK.md#what-to-alert-on
